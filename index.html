<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="creativemaybeno's portfolio - A Tron: Legacy inspired 3D experience showcasing Flutter, open source, and creative development work.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="creativemaybeno">
  <link rel="apple-touch-icon" href="assets/avatar.png">

  <!-- Favicon -->
  <link rel="shortcut icon" type="image/png" href="assets/avatar.png">

  <title>creativemaybeno | Portfolio</title>

  <!-- Preload fonts for reliable loading -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Exo+2:wght@300;400;500&display=swap" rel="stylesheet">

  <!-- Main stylesheet -->
  <link rel="stylesheet" href="/src/styles/main.css">
</head>
<body>
  <div id="loading-screen">
    <div class="convergence-container">
      <canvas id="convergence-canvas"></canvas>
    </div>
    <div class="loading-content">
      <div class="loading-text">Loading</div>
      <div class="loading-subtitle">Initializing Grid</div>
    </div>
    <div class="convergence-flash"></div>
  </div>

  <div id="progress-bar"></div>

  <div id="canvas-container"></div>

  <div id="ui-overlay"></div>

  <div id="scroll-indicator">
    <span>Scroll to explore</span>
    <div class="scroll-arrow"></div>
  </div>

  <!-- Loading animation initialization (must run before main.js) -->
  <script type="module">
    import { setupLoadingAnimation } from '/src/loading/LoadingAnimation.js';

    // Wait for fonts to load before showing loading text
    document.fonts.ready.then(() => {
      document.getElementById('loading-screen').classList.add('fonts-loaded');
    });

    // Initialize loading animation
    setupLoadingAnimation();
  </script>

  <!-- Main application -->
  <script type="module" src="/src/main.js"></script>
</body>
</html>
