<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="creativemaybeno's portfolio - A Tron: Legacy inspired 3D experience showcasing Flutter, open source, and creative development work.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="creativemaybeno">
  <link rel="apple-touch-icon" href="assets/avatar.png">

  <!-- Favicon -->
  <link rel="shortcut icon" type="image/png" href="assets/avatar.png">

  <title>creativemaybeno | Portfolio</title>

  <!-- Preload fonts for reliable loading -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Exo+2:wght@300;400;500&display=swap" rel="stylesheet">

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: 'Exo 2', sans-serif;
      color: #fff;
    }

    #canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    canvas {
      display: block;
    }

    #ui-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }

    #scroll-indicator {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      opacity: 1;
      transition: opacity 0.5s ease;
      z-index: 100;
      pointer-events: none;
    }

    #scroll-indicator.hidden {
      opacity: 0;
    }

    #scroll-indicator span {
      font-family: 'Orbitron', sans-serif;
      font-size: 12px;
      color: #00d4ff;
      text-transform: uppercase;
      letter-spacing: 3px;
      text-shadow: 0 0 10px #00d4ff, 0 0 20px #00d4ff;
    }

    .scroll-arrow {
      width: 30px;
      height: 30px;
      border-left: 2px solid #00d4ff;
      border-bottom: 2px solid #00d4ff;
      transform: rotate(-45deg);
      animation: scrollBounce 2s infinite;
      box-shadow: -3px 3px 10px #00d4ff;
    }

    @keyframes scrollBounce {
      0%, 20%, 50%, 80%, 100% {
        transform: rotate(-45deg) translateY(0);
      }
      40% {
        transform: rotate(-45deg) translateY(10px);
      }
      60% {
        transform: rotate(-45deg) translateY(5px);
      }
    }

    #progress-bar {
      position: fixed;
      top: 0;
      left: 0;
      height: 3px;
      background: linear-gradient(90deg, #00d4ff, #ff6600);
      width: 0%;
      z-index: 1000;
      box-shadow: 0 0 10px #00d4ff, 0 0 20px #00d4ff;
    }

    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10000;
      transition: opacity 1s ease;
    }

    #loading-screen.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    .loading-text {
      font-family: 'Orbitron', sans-serif;
      font-size: 24px;
      color: #00d4ff;
      text-shadow: 0 0 20px #00d4ff, 0 0 40px #00d4ff;
      animation: loadingPulse 1.5s infinite;
    }

    @keyframes loadingPulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    .loading-bar {
      width: 200px;
      height: 4px;
      background: rgba(0, 212, 255, 0.2);
      margin-top: 30px;
      position: relative;
      overflow: hidden;
    }

    .loading-bar::after {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, #00d4ff, transparent);
      animation: loadingSlide 1.5s infinite;
    }

    @keyframes loadingSlide {
      0% { left: -100%; }
      100% { left: 100%; }
    }

    /* Clickable link styles */
    .content-link {
      pointer-events: auto;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .content-link:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <div id="loading-screen">
    <div class="loading-text">INITIALIZING</div>
    <div class="loading-bar"></div>
  </div>

  <div id="progress-bar"></div>

  <div id="canvas-container"></div>

  <div id="ui-overlay"></div>

  <div id="scroll-indicator">
    <span>Scroll to explore</span>
    <div class="scroll-arrow"></div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
