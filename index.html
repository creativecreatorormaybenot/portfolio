<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="creativemaybeno's portfolio - A Tron: Legacy inspired 3D experience showcasing Flutter, open source, and creative development work.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="creativemaybeno">
  <link rel="apple-touch-icon" href="assets/avatar.png">

  <!-- Favicon -->
  <link rel="shortcut icon" type="image/png" href="assets/avatar.png">

  <title>creativemaybeno | Portfolio</title>

  <!-- Preload fonts for reliable loading -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Exo+2:wght@300;400;500&display=swap" rel="stylesheet">

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: 'Exo 2', sans-serif;
      color: #fff;
    }

    #canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    canvas {
      display: block;
    }

    #ui-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }

    #scroll-indicator {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      opacity: 1;
      transition: opacity 0.5s ease;
      z-index: 100;
      pointer-events: none;
    }

    #scroll-indicator.hidden {
      opacity: 0;
    }

    #scroll-indicator span {
      font-family: 'Orbitron', sans-serif;
      font-size: 12px;
      color: #00d4ff;
      text-transform: uppercase;
      letter-spacing: 3px;
      text-shadow: 0 0 10px #00d4ff, 0 0 20px #00d4ff;
    }

    .scroll-arrow {
      width: 30px;
      height: 30px;
      border-left: 2px solid #00d4ff;
      border-bottom: 2px solid #00d4ff;
      transform: rotate(-45deg);
      animation: scrollBounce 2s infinite;
      box-shadow: -3px 3px 10px #00d4ff;
    }

    @keyframes scrollBounce {
      0%, 20%, 50%, 80%, 100% {
        transform: rotate(-45deg) translateY(0);
      }
      40% {
        transform: rotate(-45deg) translateY(10px);
      }
      60% {
        transform: rotate(-45deg) translateY(5px);
      }
    }

    #progress-bar {
      position: fixed;
      top: 0;
      left: 0;
      height: 3px;
      background: linear-gradient(90deg, #00d4ff, #ff6600);
      width: 0%;
      z-index: 1000;
      box-shadow: 0 0 10px #00d4ff, 0 0 20px #00d4ff;
    }

    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000a12;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10000;
      transition: opacity 0.8s ease;
    }

    #loading-screen.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    .loading-circuit {
      position: relative;
      width: 200px;
      height: 120px;
      margin-bottom: 30px;
    }

    #circuit-canvas {
      width: 100%;
      height: 100%;
    }

    .loading-text {
      font-family: 'Orbitron', sans-serif;
      font-size: 18px;
      color: #00d4ff;
      text-transform: uppercase;
      letter-spacing: 8px;
      text-shadow: 0 0 20px #00d4ff, 0 0 40px #00d4ff;
      animation: loadingPulse 2s infinite ease-in-out;
    }

    @keyframes loadingPulse {
      0%, 100% { opacity: 0.6; text-shadow: 0 0 10px #00d4ff, 0 0 20px #00d4ff; }
      50% { opacity: 1; text-shadow: 0 0 20px #00d4ff, 0 0 40px #00d4ff, 0 0 60px #00d4ff; }
    }

    .loading-subtitle {
      font-family: 'Exo 2', sans-serif;
      font-size: 11px;
      color: #446688;
      letter-spacing: 4px;
      margin-top: 15px;
      text-transform: uppercase;
    }

    /* Clickable link styles */
    .content-link {
      pointer-events: auto;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .content-link:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <div id="loading-screen">
    <div class="loading-circuit">
      <canvas id="circuit-canvas"></canvas>
    </div>
    <div class="loading-text">Loading</div>
    <div class="loading-subtitle">Initializing Grid</div>
  </div>

  <script>
    // Tron-style circuit trace loading animation
    (function() {
      const canvas = document.getElementById('circuit-canvas');
      const ctx = canvas.getContext('2d');

      // Set canvas size with device pixel ratio for sharpness
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);

      const width = rect.width;
      const height = rect.height;
      const padding = 20;
      const hw = (width - padding * 2) / 2;
      const hh = (height - padding * 2) / 2;
      const cx = width / 2;
      const cy = height / 2;

      let tracePosition = 0;
      const traceCount = 12;
      const trailSpacing = 0.025;
      const speed = 0.008;

      // Get position along border (t = 0 to 1)
      function getBorderPos(t) {
        t = ((t % 1) + 1) % 1;
        const topLen = hw * 2;
        const rightLen = hh * 2;
        const bottomLen = hw * 2;
        const leftLen = hh * 2;
        const total = topLen + rightLen + bottomLen + leftLen;
        const d = t * total;

        let x, y;
        if (d < topLen) {
          x = cx - hw + d;
          y = cy - hh;
        } else if (d < topLen + rightLen) {
          x = cx + hw;
          y = cy - hh + (d - topLen);
        } else if (d < topLen + rightLen + bottomLen) {
          x = cx + hw - (d - topLen - rightLen);
          y = cy + hh;
        } else {
          x = cx - hw;
          y = cy + hh - (d - topLen - rightLen - bottomLen);
        }
        return { x, y };
      }

      function draw() {
        ctx.clearRect(0, 0, width, height);

        // Draw border rectangle (dim)
        ctx.strokeStyle = 'rgba(0, 212, 255, 0.2)';
        ctx.lineWidth = 2;
        ctx.strokeRect(cx - hw, cy - hh, hw * 2, hh * 2);

        // Draw corner accents
        const cornerSize = 8;
        ctx.fillStyle = 'rgba(0, 212, 255, 0.5)';
        [[cx - hw, cy - hh], [cx + hw, cy - hh], [cx + hw, cy + hh], [cx - hw, cy + hh]].forEach(([x, y]) => {
          ctx.beginPath();
          ctx.arc(x, y, 3, 0, Math.PI * 2);
          ctx.fill();
        });

        // Draw circuit trace trail
        for (let i = 0; i < traceCount; i++) {
          const t = tracePosition - i * trailSpacing;
          const pos = getBorderPos(t);
          const alpha = 1 - (i / traceCount);
          const size = 4 - (i / traceCount) * 2;

          // Glow
          ctx.beginPath();
          ctx.arc(pos.x, pos.y, size + 4, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(0, 212, 255, ${alpha * 0.3})`;
          ctx.fill();

          // Core
          ctx.beginPath();
          ctx.arc(pos.x, pos.y, size, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255, 255, 255, ${alpha * 0.9})`;
          ctx.fill();
        }

        // Advance trace
        tracePosition = (tracePosition + speed) % 1;

        requestAnimationFrame(draw);
      }

      draw();
    })();
  </script>

  <div id="progress-bar"></div>

  <div id="canvas-container"></div>

  <div id="ui-overlay"></div>

  <div id="scroll-indicator">
    <span>Scroll to explore</span>
    <div class="scroll-arrow"></div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
