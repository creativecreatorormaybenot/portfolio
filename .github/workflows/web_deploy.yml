name: web app

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/web_deploy.yml'
      - 'src/**'
      - 'index.html'
      - 'package.json'
      - 'vite.config.js'
      - 'assets/**'

jobs:
  deploy:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    name: Build and Deploy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Prepare for deployment
        run: |
          cd dist
          touch ".nojekyll"
          echo "portfolio.creativemaybeno.dev" > CNAME
          cp -r ../assets ./assets 2>/dev/null || true

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
          git-config-name: creativecreatorormaybenot
          git-config-email: creativecreatorormaybenot@gmail.com
          commit-message: Deploy portfolio
